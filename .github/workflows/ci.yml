name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This repo uses pnpm (pnpm-lock.yaml + pnpm-workspace.yaml). The stock Nx
      # template shipped npm; that fails here because there is no package-lock.json.
      - uses: pnpm/action-setup@v4
        # No version here: action-setup@v4 reads "packageManager" from
        # package.json, so CI, the devcontainer and a developer machine
        # cannot drift onto different pnpm releases. Declaring both made
        # the action refuse to choose and fail before any step ran.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Nx Cloud (start-ci-run / record / fix-ci) removed: needs an unconfigured
      # token, and a red Actions tab during a demo undercuts the pitch.
      # .ai/standards/adr.md partitions ADR numbers into per-branch blocks. Two
      # ADR-0001s reached the repo while that rule was prose, so it is checked.
      - run: node tools/adr/check-numbering.mjs

      - run: pnpm exec nx format:check --base=origin/main
      - run: pnpm exec nx affected -t lint test build typecheck --base=origin/main
      # NB: affected across an empty workspace is a no-op and exits 0. Once
      # packages/ has projects, these targets do real work.
