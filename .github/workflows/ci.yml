name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This repo uses pnpm (pnpm-lock.yaml + pnpm-workspace.yaml). The stock Nx
      # template shipped npm; that fails here because there is no package-lock.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Nx Cloud (start-ci-run / record / fix-ci) removed: needs an unconfigured
      # token, and a red Actions tab during a demo undercuts the pitch.
      - run: pnpm exec nx format:check --base=origin/main
      - run: pnpm exec nx affected -t lint test build typecheck --base=origin/main
      # NB: affected across an empty workspace is a no-op and exits 0. Once
      # packages/ has projects, these targets do real work.
